<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally</title>
<link rel="icon" href="/static/img/logo.svg" type="image/svg+xml">
<style>
:root{--paper:#f4f0e6;--card:#fbf9f3;--ink:#1d1b16;--mute:#7b7566;--line:#d9d2c0;--accent:#c2410c;--up:#15703b;--down:#b3261e;--seed:#a79f8c;--new:#fff1c9;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;padding-bottom:28px}
header{display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:30px;height:30px}
.brand b{font:700 25px var(--serif);letter-spacing:-.5px}
.brand span{color:var(--mute);font:italic 13px var(--serif)}
form{flex:1;display:flex;gap:8px;min-width:280px;position:relative}
#ghost{position:absolute;left:0;top:0;width:100%;color:var(--seed);pointer-events:none;z-index:0;flex:none}
#q{position:relative;z-index:1;background:transparent}
.srow.sel{background:#ece5d3}
.srow mark{background:none;color:var(--accent);font-weight:700}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);z-index:15;max-height:70vh;overflow:auto;padding:6px 0}
.shead{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:10px 14px 4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;cursor:pointer}
.srow:hover{background:#f1ecdf}
.sbtn{font:12px inherit;border:1px solid var(--ink);border-radius:6px;padding:3px 10px;white-space:nowrap;background:var(--card)}
.spack{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 8px}
.spack span,.spack .chip{font:12px var(--mono);border:1px solid var(--line);border-radius:14px;padding:3px 10px;text-decoration:none;background:#fff}
.spack .chip{border-color:var(--ink)}
input[type=text],input[type=search]{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit}
input:focus{outline:2px solid var(--ink);outline-offset:-1px}
button{font:inherit;padding:8px 13px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:var(--ink)}
button.pro{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
#acct{display:flex;gap:10px;align-items:center}
#acct img{width:28px;height:28px;border-radius:50%}
.plan{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;border-radius:3px;padding:2px 6px;border:1px solid var(--line);color:var(--mute)}
.plan.pro{background:var(--accent);border-color:var(--accent);color:#fff}
nav{display:flex;gap:4px;padding:14px 24px 0;align-items:center}
nav a{padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute)}
nav a.on{background:var(--ink);color:var(--paper)}
nav label{margin-left:auto;color:var(--mute);display:none;gap:6px;align-items:center}
#banner{margin:14px 24px 0;padding:10px 14px;border:1px dashed var(--seed);border-radius:8px;color:#4a463c;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
main{padding:16px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;cursor:pointer;position:relative;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
.tile.muted{opacity:.45}
.tile.delayed{background:repeating-linear-gradient(135deg,var(--card),var(--card) 10px,#f6f2e8 10px,#f6f2e8 20px)}
.tile.flash{animation:flash 1.6s}
@keyframes flash{0%{background:var(--new)}100%{background:var(--card)}}
.tile h3{margin:0;font:600 13px/1.3 inherit;display:flex;justify-content:space-between;gap:8px}
.kind{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:1px 5px;height:fit-content;white-space:nowrap}
.kind.live{color:var(--up);border-color:var(--up)}
.kind.late{color:var(--seed);border-style:dashed}
.val{font:600 34px/1.15 var(--mono);font-variant-numeric:tabular-nums;margin:10px 0 0;letter-spacing:-1px}
.val small{font:12px var(--mono);color:var(--mute);letter-spacing:0;margin-left:6px}
.val.none{font:italic 18px var(--serif);color:var(--mute);letter-spacing:0;padding:9px 0}
.delta{font:12px var(--mono);height:18px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
svg.spark{display:block;width:100%;height:46px;margin:6px 0 2px}
.seedcap{font:10px var(--mono);color:var(--seed);height:14px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-top:6px;gap:8px}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chips{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip-i{display:inline-flex;gap:4px;align-items:center;font:12px var(--mono);white-space:nowrap}
.chip-i.acc{color:var(--accent)}
.thead{display:flex;gap:9px;align-items:flex-start;min-width:0}
.theme{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--paper);display:grid;place-items:center;flex:none;margin-top:-2px}
.theme svg.i{width:16px;height:16px}
.livedot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px #15703b22;flex:none;margin:5px 2px 0 0}
.foot button{padding:4px 9px;font-size:12px}
.badge{position:absolute;top:-8px;right:12px;background:var(--accent);color:#fff;font:600 10px var(--mono);padding:2px 7px;border-radius:9px}
.pending{border-style:dashed;color:var(--mute);display:flex;align-items:center;justify-content:center;min-height:190px;font:italic 15px var(--serif);text-align:center;cursor:default}
.empty{color:var(--mute);font:italic 16px var(--serif);padding:40px 0}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--ink);padding:20px 22px;overflow:auto;transform:translateX(105%);transition:transform .2s;z-index:5}
#panel.open{transform:none}
#panel h2,#modal h2{font:700 20px/1.25 var(--serif);margin:0 30px 4px 0}
.x{position:absolute;top:14px;right:14px;padding:2px 9px}
#panel h4{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
#panel q{display:block;font:italic 14px var(--serif);border-left:3px solid var(--accent);padding-left:10px;margin:8px 0;quotes:none}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:2px;word-break:break-word}
ul.rows{list-style:none;margin:0;padding:0}
ul.rows li{padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}
ul.rows li.new{background:var(--new)}
.tag{font:10px var(--mono);border-radius:3px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.tag.new{background:var(--accent);color:#fff}.tag.seeded{border:1px dashed var(--seed);color:var(--seed)}
.tag.monitor{background:#1d4d8f;color:#fff}.tag.run_now{background:var(--ink);color:var(--paper)}.tag.feedback{border:1px solid var(--line);color:var(--mute)}
.when{font:11px var(--mono);color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td .followbtn{padding:4px 9px;font-size:12px}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.cathead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#trace{background:var(--ink);color:var(--paper);padding:16px 22px;display:flex;gap:34px;align-items:center;font-size:12px;border-radius:10px;flex-wrap:wrap;margin-bottom:14px}
.tstat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.tstat div{background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 11px}
.tstat b{display:block;font:600 17px var(--mono)}
.tstat span{font:9px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#a8a08c}
#trace .k{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#a8a08c;display:block}
#trace .v{font:600 18px var(--mono)}
#trace .v small{font:11px var(--mono);font-weight:400;color:#cfc8b6;margin-left:6px}
#trace .t{font:700 15px var(--serif);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:80vw}
#toast.on{opacity:1}
#veil{position:fixed;inset:0;background:#1d1b1699;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--paper);border:1px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--ink);padding:26px 28px;width:min(860px,100%);position:relative;max-height:92vh;overflow:auto}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.pcard.hot{border:2px solid var(--accent)}
.pcard b{font:700 20px var(--serif)}
.pcard .price{font:600 28px var(--mono)}
.pcard .price small{font:12px var(--mono);color:var(--mute)}
.pcard ul{margin:4px 0 10px;padding-left:18px;color:#4a463c;font-size:13px;flex:1}
.pcard li{margin:3px 0}
#gbtn{min-height:40px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
 <symbol id="i-funding" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></symbol>
 <symbol id="i-roles" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M18.5 8v6M15.5 11h6"/></symbol>
 <symbol id="i-launch" viewBox="0 0 24 24"><path d="M12 3c3.2 2.3 5 6 5 10l-2 3H9l-2-3c0-4 1.8-7.700 5-10z"/><circle cx="12" cy="10" r="1.7"/><path d="M10 19.500l2 2 2-2"/></symbol>
 <symbol id="i-batch" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.500"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.500"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.500"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.500"/></symbol>
 <symbol id="i-price" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.800" cy="8.800" r="1.300"/></symbol>
 <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.500l2.600 5.400 5.900.800-4.300 4.100 1 5.900L12 16.900 6.800 19.700l1-5.900L3.500 9.700l5.900-.800z"/></symbol>
 <symbol id="i-number" viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></symbol>
 <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.500"/><path d="M12 7.500V12l3 2"/></symbol>
 <symbol id="i-people" viewBox="0 0 24 24"><circle cx="8.500" cy="9" r="3"/><path d="M2.500 19.500c0-3 2.700-5.500 6-5.500s6 2.500 6 5.500M16 6.500a3 3 0 010 5.500M17.500 14.300c2.300.700 4 2.700 4 5.200"/></symbol>
 <symbol id="i-radar" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.800"/><path d="M7.800 16.200a6 6 0 010-8.400M16.200 7.800a6 6 0 010 8.400M4.900 19.100a10 10 0 010-14.200M19.100 4.900a10 10 0 010 14.200"/></symbol>
 <symbol id="i-seal" viewBox="0 0 24 24"><path d="M12 3l2.300 1.700 2.900-.100.900 2.700 2.300 1.700-.900 2.700.900 2.700-2.300 1.700-.900 2.700-2.900-.100L12 21l-2.300-1.700-2.900.100-.900-2.700-2.300-1.700.900-2.700-.900-2.700 2.300-1.700.900-2.700 2.900.100z"/><path d="M8.800 12.200l2.200 2.200 4.200-4.400"/></symbol>
</defs></svg>
<header>
  <a href="/" class="brand"><img src="/static/img/logo.svg" alt=""><b>Tally</b><span>A running tally of the outside world.</span></a>
  <form id="add"><input type="text" id="ghost" tabindex="-1" disabled aria-hidden="true"><input type="text" id="q" placeholder="Search anything you want tracked: a company, an investor, a market — or ask for a number" autocomplete="off"><div id="sugg" hidden></div></form>
  <div id="acct"></div>
</header>
<div id="banner" hidden></div>
<nav><a data-tab="board" class="on">Board</a><a data-tab="log">Change log</a><a data-tab="catalog">Shared catalog</a><a data-tab="trace">Telem trace</a>
  <label id="f24"><input type="checkbox" id="last24"> last 24h</label></nav>
<main><div id="board" class="grid"></div><div id="log" hidden></div>
  <div id="tracetab" hidden><div id="trace"></div><div id="tracecalls"></div></div>
  <div id="catalog" hidden><div class="cathead"><input type="search" id="cq" placeholder="Search the catalog: a company, “stars”, “price”, “funding”…"><span class="when" id="ccount"></span></div><div id="ctable"></div></div></main>
<aside id="panel"></aside>
<div id="veil" hidden><div id="modal"></div></div>
<div id="toast"></div>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={me:{user:null},tiles:[],tab:"board",pending:null,flash:null,open:null,featured:true};

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);
  const j=await r.json().catch(()=>({}));
  if(r.status==401){signInModal(j.detail); throw new Error(j.detail||"Sign in to do that")}
  if(r.status==402){plansModal(j.detail); throw new Error(j.detail)}
  if(!r.ok) throw new Error(j.detail||r.statusText);
  return j;
}
function toast(t,ms=3500){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms)}
function ago(iso){ if(!iso) return "never"; const s=(Date.now()-new Date(iso))/1e3;
  return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"}
function until(iso){const s=(new Date(iso)-Date.now())/1e3; return s<=60?"check due":s<3600?"in "+Math.ceil(s/60)+"m":"in "+Math.round(s/3600)+"h"}
function num(v){const a=Math.abs(v); const t=x=>String(+x.toFixed(2));
  return a>=1e9?t(v/1e9)+"B":a>=1e6?t(v/1e6)+"M":v.toLocaleString("en-US",{maximumFractionDigits:2})}
const CUR={usd:"$",eur:"€",gbp:"£"};
function val(v,unit){ if(v==null) return null; const m=/^(usd|eur|gbp)\b\s*/i.exec(unit||"");
  return {text:(m?CUR[m[1].toLowerCase()]:"")+num(v), unit:m?unit.slice(m[0].length):(unit||"")}}

/* ---------- account ---------- */
async function loadMe(){
  S.me=await (await fetch("/api/me")).json(); const u=S.me.user, a=$("#acct");
  a.innerHTML=u?`${u.plan=="pro"?"":`<button class="pro" id="upg">Upgrade</button>`}<span class="plan ${u.plan}">${u.plan}</span>
      ${u.picture?`<img src="${esc(u.picture)}" alt="" referrerpolicy="no-referrer">`:""}<span title="${esc(u.email)}">${esc((u.name||u.email).split(" ")[0])}</span><button class="ghost" id="out">Sign out</button>`
    :`<button id="in">Sign in</button>`;
  if($("#in")) $("#in").onclick=()=>signInModal();
  if($("#upg")) $("#upg").onclick=()=>plansModal();
  if($("#out")) $("#out").onclick=async()=>{await api("/api/auth/logout",{}); closePanel(); await loadMe(); refresh()};
  const b=$("#banner");
  if(!u){b.hidden=false;b.innerHTML=`<span>You're browsing the <b>featured board</b>. Everything in the catalog is open to read and search; featured numbers are live, the rest are delayed. Sign in for your own board and to track new companies and numbers.</span><button id="in2">Sign in with Google</button>`;$("#in2").onclick=()=>signInModal()}
  else if(u.plan!="pro"){b.hidden=false;b.innerHTML=`<span><b>Free plan:</b> featured metrics, the ones you create (${u.created}/${S.me.free_create}), and your first ${S.me.free_live} catalog picks are live. Everything else shows a delayed value.</span><button class="pro" id="upg2">Go Pro · $${S.me.price_usd}/mo</button>`;$("#upg2").onclick=()=>plansModal()}
  else b.hidden=true;
}
function modal(html){$("#modal").innerHTML=`<button class="ghost x">×</button>`+html; $("#veil").hidden=false}
function closeModal(){$("#veil").hidden=true}
$("#veil").onclick=ev=>{if(ev.target.id=="veil"||ev.target.closest(".x")) closeModal()};
async function afterSignIn(u){closeModal(); toast("Signed in as "+(u.name||u.email)); await loadMe(); refresh()}
function signInModal(why){
  modal(`<h2>Sign in to Tally</h2><p style="color:#4a463c;margin:6px 0 18px">${esc(why&&why!="Sign in to do that"?why:"Reading and searching the catalog is open to everyone. Sign in to keep your own board, see more live numbers and ask for new ones.")}</p>
    <div id="gbtn"></div>${S.me.google_client_id?"":'<div class="when">Google sign-in is not configured on this server yet.</div>'}
    ${S.me.demo_login?'<p class="when" style="margin-top:18px">Presenting? <a href="#" id="demo">Use the demo passcode</a></p>':""}`);
  if(S.me.google_client_id&&window.google){
    google.accounts.id.initialize({client_id:S.me.google_client_id,callback:async r=>{
      try{const j=await api("/api/auth/google",{credential:r.credential}); afterSignIn(j.user)}catch(e){toast(e.message,6000)}}});
    google.accounts.id.renderButton($("#gbtn"),{theme:"filled_black",size:"large",shape:"rectangular",text:"continue_with",logo_alignment:"left",width:280});
  }
  if($("#demo")) $("#demo").onclick=async ev=>{ev.preventDefault(); const k=prompt("Demo passcode:"); if(!k) return;
    const r=await fetch("/api/auth/demo",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({passcode:k})});
    const j=await r.json(); r.ok?afterSignIn(j.user):toast(j.detail||"Wrong passcode")};
}
function plansModal(why){
  const u=S.me.user, p=u&&u.plan;
  modal(`<h2>Plans</h2>${why?`<p style="color:var(--accent);margin:6px 0 0">${esc(why)}</p>`:""}
  <div class="plans">
    <div class="pcard"><b>Visitor</b><div class="price">$0</div><ul><li>Read and search the whole catalog</li><li>Featured metrics live</li><li>Everything else delayed</li></ul>${u?"":'<span class="when">You are here</span>'}</div>
    <div class="pcard"><b>Free account</b><div class="price">$0 <small>with Google</small></div><ul><li>Your own board</li><li>Live on featured metrics, what you create, and ${S.me.free_live} catalog picks</li><li>Create ${S.me.free_create} new metrics</li><li>Run now and change log</li></ul>
      ${u?(p=="free"?'<span class="when">You are here</span>':""):'<button id="pin">Sign in with Google</button>'}</div>
    <div class="pcard hot"><b>Pro</b><div class="price">$${S.me.price_usd} <small>/ month</small></div><ul><li>Every metric live, with evidence</li><li>Unlimited new metrics</li><li>Run now on anything</li><li>Hourly Telem monitor on each metric you create</li></ul>
      ${p=="pro"?'<span class="when">You are here. Thank you.</span>':`<button class="pro" id="buy">${S.me.billing?"Upgrade with Stripe":"Billing opens soon"}</button>`}</div>
  </div>`);
  if($("#pin")) $("#pin").onclick=()=>signInModal();
  if($("#buy")) $("#buy").onclick=async()=>{ if(!S.me.user) return signInModal("Sign in first, then upgrade."); if(!S.me.billing) return toast("Billing is not configured on this server yet.");
    $("#buy").disabled=true; try{const j=await api("/api/billing/checkout",{}); if(j.url) location.href=j.url; else {toast("You're already on Pro"); loadMe()}}catch(e){toast(e.message,6000); $("#buy").disabled=false}};
}

/* ---------- board ---------- */
function spark(pts){
  if(pts.length<2) return '<svg class="spark"></svg><div class="seedcap"></div>';
  const W=240,H=46,P=4,vs=pts.map(p=>p.value),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn;
  const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1), r?H-P-(p.value-mn)/r*(H-2*P):H/2]);
  const firstReal=pts.findIndex(p=>!p.seeded), cut=firstReal<0?pts.length:firstReal;
  const path=a=>a.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const seeded=xy.slice(0,Math.min(cut+1,xy.length)), real=xy.slice(Math.max(cut,0)), last=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${seeded.length>1?`<path d="${path(seeded)}" fill="none" stroke="var(--seed)" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:""}
    ${real.length>1?`<path d="${path(real)}" fill="none" stroke="var(--ink)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`:""}
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>
    <div class="seedcap">${cut>0?"┄ seeded history · ━ observed":""}</div>`;
}

  if(c.kind=="entity_added") return `Telem now tracks: ${esc(c.note||c.after)}${link}`;
  if(c.kind=="value_changed") return `<b>${esc(c.before??"—")} → ${esc(c.after)}</b>${c.note?" · "+esc(c.note):""}${link}`;
  if(c.kind=="source_changed") return `${esc(c.note)}: <a href="${esc(c.after)}" target="_blank">${esc(c.after)}</a>`;

  if(act=="open") return openPanel(+arg);
  if(act=="follow"){ if(!S.me.user) return signInModal("Sign in to follow catalog metrics on your own board."); $("#q").value=""; try{await followMetric(arg); S.flash=+arg; setTab("board")}catch(e){} return }
  if(act=="followall"){ if(!S.me.user) return signInModal("Sign in to follow catalog metrics on your own board."); $("#q").value="";
    try{for(const id of arg.split(",")) await api(`/api/metrics/${id}/follow`,{}); toast("Added to your board with their history. No new Telem calls."); setTab("board"); await loadMe(); refresh()}catch(e){} return }
  if(act=="pack") return doPack(arg);
  if(act=="create") return doCreate(arg);
}
$("#q").oninput=()=>showResults().catch(()=>{});
$("#q").onfocus=()=>showResults().catch(()=>{});
$("#q").onkeydown=ev=>{
  const g=$("#ghost").value, q=$("#q");
  if((ev.key=="Tab"||(ev.key=="ArrowRight"&&q.selectionStart==q.value.length))&&g&&g!=q.value){ev.preventDefault(); q.value=g; return showResults()}
  if(ev.key=="ArrowDown"){ev.preventDefault(); if($("#sugg").hidden) return showResults(); return setSel(sel+1)}
  if(ev.key=="ArrowUp"){ev.preventDefault(); return setSel(sel-1)}
  if(ev.key=="Enter"){ev.preventDefault(); return submitSearch()}  // a form with two text fields does not submit on Enter by itself
  if(ev.key=="Escape"){hideSugg(); $("#ghost").value=""}};
async function submitSearch(){ if(!$("#q").value.trim()) return; if($("#sugg").hidden) await showResults();
  const rows=document.querySelectorAll("#sugg .srow"); if(rows.length) pick(rows[sel]||rows[0])}
$("#add").onsubmit=ev=>{ev.preventDefault(); submitSearch()};
$("#sugg").onclick=ev=>{const c=ev.target.closest(".chip"); if(c){ev.preventDefault(); $("#q").value=c.dataset.fill; $("#q").focus(); return showResults()} const r=ev.target.closest(".srow"); if(r) pick(r)};
document.addEventListener("click",ev=>{if(!ev.target.closest("#add")) hideSugg()});
$("#board").onclick=async ev=>{
  const b=ev.target.closest(".run"), g=ev.target.closest(".golive"), t=ev.target.closest(".tile[data-id]");
  if(g){ev.stopPropagation(); S.me.user?plansModal("This metric is delayed on your plan."):signInModal()}
  else if(b){ev.stopPropagation(); if(!S.me.user) return signInModal("Sign in to refresh a metric."); S.busy=true; b.disabled=true; b.textContent="Checking…";
    try{const r=await api(`/api/metrics/${b.dataset.id}/run`,{}); S.flash=+b.dataset.id;
      if(r.new_entries&&r.new_entries.length){toast(`+${r.new_entries.length} new ${r.new_entries.length>1?"entries":"entry"} found`); S.open=+b.dataset.id}
      else toast(r.found?(r.changed?"Value changed":"Checked — no change"):"Checked — no value found")}
    catch(e){toast(e.message,6000)} S.busy=false; refresh()}
  else if(t) openPanel(+t.dataset.id)};
$("#panel").onclick=async ev=>{
  if(ev.target.closest(".x")) return closePanel();
  if(ev.target.closest("#pup")) return plansModal();
  const rp=ev.target.closest(".runp"); if(rp){ if(!S.me.user) return signInModal("Sign in to ask for an early check."); S.busy=true; rp.disabled=true; rp.textContent="Checking…";
    try{const r=await api(`/api/metrics/${S.open}/run`,{}); S.flash=S.open;
      toast(r.new_entries&&r.new_entries.length?`+${r.new_entries.length} new ${r.new_entries.length>1?"entries":"entry"} found`:r.found?(r.changed?"Value changed":"Checked — no change"):"Checked — no value found")}
    catch(e){toast(e.message,6000)} S.busy=false; return refresh()}
  const na=ev.target.closest(".nac"); if(na){ev.preventDefault(); try{await api(`/api/changes/${na.dataset.c}/reject`,{}); toast("Marked as not a change. Hidden for everyone who tracks this metric.")}catch(e){} return refresh()}
  if(ev.target.closest("#pin2")) return signInModal();
  const fo=ev.target.closest(".fol"); if(fo){ try{await followMetric(fo.dataset.id)}catch(e){} return }
  if(ev.target.closest(".unf")){ try{await api(`/api/metrics/${S.open}/unfollow`,{}); closePanel(); toast("Removed from your board"); await loadMe(); refresh()}catch(e){} return }
  const f=ev.target.closest(".fb"); if(!f) return; f.disabled=true;
  try{const r=await api(`/api/metrics/${S.open}/feedback`,{action:f.dataset.a});
    toast(f.dataset.a=="mute"?(r.muted?"Muted on your board":"Unmuted"):(r.resolved?"Source re-resolved":"No better source found"))}
  catch(e){toast(e.message,6000)} refresh()};
function setTab(tab){S.tab=tab; document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.tab==tab));
  $("#board").hidden=tab!="board"; $("#log").hidden=tab!="log"; $("#catalog").hidden=tab!="catalog"; $("#tracetab").hidden=tab!="trace"; $("#f24").style.display=tab=="log"?"flex":"none"; refresh()}
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>setTab(a.dataset.tab));
$("#last24").onchange=loadLog;
let cqT; $("#cq").oninput=()=>{clearTimeout(cqT); cqT=setTimeout(loadCatalog,180)};
$("#ctable").onclick=async ev=>{const b=ev.target.closest(".followbtn"), row=ev.target.closest("tr[data-id]");
  if(b){ if(!S.me.user) return signInModal("Sign in to add catalog metrics to your own board."); b.disabled=true; try{await followMetric(b.dataset.id)}catch(e){} }
  else if(row) openPanel(+row.dataset.id)};
document.onkeydown=ev=>{if(ev.key=="Escape"){closeModal();closePanel()}};

(async()=>{
  await loadMe();
  const p=new URLSearchParams(location.search);
  if(p.get("tab")) setTab(p.get("tab")); else refresh();
  if(p.get("q")){ setTab("catalog"); $("#cq").value=p.get("q"); loadCatalog() }
  if(p.get("checkout")=="success"&&p.get("session_id")){
    try{const r=await api("/api/billing/confirm?session_id="+encodeURIComponent(p.get("session_id"))); toast(r.pro?"Welcome to Pro. Every metric is live now.":"Payment not confirmed yet.",6000)}catch(e){toast(e.message,6000)}
    history.replaceState({},"","/app"); await loadMe(); refresh()}
  if(p.get("checkout")=="cancel"){toast("Checkout cancelled"); history.replaceState({},"","/app")}
  if(p.get("plans")) plansModal();
  setInterval(loadTrace,15000); setInterval(pollBoard,10000);
})();
</script>
</body>
