<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally</title>
<link rel="icon" href="/static/img/logo.svg?v=3" type="image/svg+xml"><link rel="icon" type="image/png" sizes="32x32" href="/static/img/favicon-32.png?v=3"><link rel="apple-touch-icon" href="/static/img/favicon-180.png?v=3">
<style>
:root{--paper:#f5f6f8;--card:#ffffff;--ink:#0e1320;--mute:#667085;--line:#e1e4ea;--accent:#2f5bff;--up:#0a8f5b;--down:#d92d20;--seed:#98a2b3;--new:#fff3bf;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;--display:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;padding-bottom:28px}
header{display:flex;gap:14px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand img{width:30px;height:30px}
.brand b{font:800 24px var(--display);letter-spacing:-.03em}
.brand span{color:var(--mute);font:13px var(--display)}
form{flex:1;display:flex;gap:8px;min-width:280px;position:relative}
#ghost{position:absolute;left:0;top:0;width:100%;color:var(--seed);pointer-events:none;z-index:0;flex:none}
#q{position:relative;z-index:1;background:transparent}
.srow.sel{background:#eaf0ff}
.srow mark{background:none;color:var(--accent);font-weight:700}
#sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(14,19,32,.12);z-index:15;max-height:70vh;overflow:auto;padding:6px 0}
.shead{font:10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--mute);padding:10px 14px 4px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 14px;cursor:pointer}
.srow:hover{background:#eef0f4}
.sbtn{font:12px inherit;border:1px solid var(--ink);border-radius:6px;padding:3px 10px;white-space:nowrap;background:var(--card)}
.spack{display:flex;gap:8px;flex-wrap:wrap;padding:4px 14px 8px}
.spack span,.spack .chip{font:12px var(--mono);border:1px solid var(--line);border-radius:14px;padding:3px 10px;text-decoration:none;background:#fff}
.spack .chip{border-color:var(--ink)}
.spack .chip.on{background:var(--ink);color:var(--paper)}
#starter .shead{padding:14px 0 6px}#starter .spack{padding:0}
#starter{max-width:520px;margin:0 auto}
.lg{border-radius:7px;background:var(--ink);color:#fff;display:inline-grid;place-items:center;font:700 12px var(--display);flex:none;position:relative;overflow:hidden;vertical-align:middle}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.spicks{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spick{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none}
.spick:hover{border-color:var(--accent);box-shadow:0 0 0 3px #eaf0ff}
.spick b{display:block;font-size:16px}.spick span{display:block;font:12px var(--mono);color:var(--mute);margin-top:4px}
#addmore{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#eaf0ff;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:14px}
#addmore .chip{font:12px var(--mono);border:1px solid var(--accent);color:var(--accent);background:#fff;border-radius:16px;padding:3px 10px;text-decoration:none}
@media(max-width:560px){.spicks{grid-template-columns:1fr}}
input[type=text],input[type=search]{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--card);font:inherit;color:inherit}
input:focus{outline:2px solid var(--ink);outline-offset:-1px}
button{font:inherit;padding:8px 13px;border:1px solid var(--ink);border-radius:6px;background:var(--ink);color:var(--paper);cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:var(--ink)}
button.pro{background:var(--accent);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:wait}
#acct{display:flex;gap:10px;align-items:center}
#acct img,#acct .av{width:28px;height:28px;border-radius:50%}
#acct .av{background:var(--ink);color:var(--paper);display:grid;place-items:center;font-weight:600;font-size:13px}
.who{position:relative;display:flex;gap:8px;align-items:center;cursor:default;padding:4px 0;outline:none}
.who .menu{display:none;position:absolute;right:0;top:100%;padding-top:6px;z-index:25}
.who:hover .menu,.who:focus-within .menu{display:block}
.who .menu>div{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(14,19,32,.12);padding:12px;min-width:200px;display:flex;flex-direction:column;gap:10px}
.who .menu .em{font:12px var(--mono);color:var(--mute);word-break:break-all}
.plan{font:600 10px var(--mono);text-transform:uppercase;letter-spacing:.08em;border-radius:3px;padding:2px 6px;border:1px solid var(--line);color:var(--mute)}
.plan.pro{background:var(--accent);border-color:var(--accent);color:#fff}
nav{display:flex;gap:4px;padding:14px 24px 0;align-items:center}
nav a{padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--mute)}
nav a.on{background:var(--ink);color:var(--paper)}
nav label{margin-left:auto;color:var(--mute);display:none;gap:6px;align-items:center}
#banner{margin:14px 24px 0;padding:10px 14px;border:1px dashed var(--seed);border-radius:8px;color:#475467;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
main{padding:16px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px 12px;cursor:pointer;position:relative;transition:border-color .15s}
.tile:hover{border-color:var(--ink)}
.tile.muted{opacity:.45}
.tile.delayed{background:repeating-linear-gradient(135deg,var(--card),var(--card) 10px,#eef0f4 10px,#eef0f4 20px)}
.tile.flash{animation:flash 1.6s}
@keyframes flash{0%{background:var(--new)}100%{background:var(--card)}}
.tile h3{margin:0;font:600 13px/1.3 inherit;display:flex;justify-content:space-between;gap:8px}
.kind{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);border:1px solid var(--line);border-radius:3px;padding:1px 5px;height:fit-content;white-space:nowrap}
.kind.live{color:var(--up);border-color:var(--up)}
.kind.late{color:var(--seed);border-style:dashed}
.val{font:600 34px/1.15 var(--mono);font-variant-numeric:tabular-nums;margin:10px 0 0;letter-spacing:-1px}
.val small{font:12px var(--mono);color:var(--mute);letter-spacing:0;margin-left:6px}
.val.none{font:italic 18px var(--display);color:var(--mute);letter-spacing:0;padding:9px 0}
.delta{font:12px var(--mono);height:18px}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
svg.spark{display:block;width:100%;height:46px;margin:6px 0 2px}
.seedcap{font:10px var(--mono);color:var(--seed);height:14px}
.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-top:auto;padding-top:6px;gap:8px}
.tile{display:flex;flex-direction:column}
svg.i{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chips{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chip-i{display:inline-flex;gap:4px;align-items:center;font:12px var(--mono);white-space:nowrap}
.chip-i.acc{color:var(--accent)}
.mv{font:600 12px var(--mono);letter-spacing:0;padding:2px 7px;border-radius:999px;margin-left:8px;white-space:nowrap;vertical-align:4px}.mv.up{background:#e7f6ef}.mv.down{background:#fdecea}
.fd{display:inline-block;width:7px;height:7px;border-radius:50%}.fd.ok{background:var(--up)}.fd.late{background:#b7791f}.fd.off{background:var(--seed)}
.foot button{padding:4px 9px;font-size:12px}
.badge{position:absolute;top:-8px;right:12px;background:var(--accent);color:#fff;font:600 10px var(--mono);padding:2px 7px;border-radius:9px}
.pending{border-style:dashed;color:var(--mute);display:flex;align-items:center;justify-content:center;min-height:190px;font:15px var(--display);text-align:center;cursor:default}
.empty{color:var(--mute);font:16px var(--display);padding:40px 0}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--card);border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(14,19,32,.08);padding:20px 22px;overflow:auto;transform:translateX(105%);transition:transform .2s;z-index:5}
#panel{pointer-events:none;padding:0;display:flex;flex-direction:column;overflow:hidden;width:min(500px,100vw)}
.ph{padding:20px 22px 0;position:relative}
.ph .q{color:var(--mute);font-size:13px}
.hero{display:flex;align-items:flex-end;gap:14px;margin:12px 0 2px}
.hero .val{font-size:42px;line-height:1;margin:0;letter-spacing:-1.5px}
.hero .val.none{font:italic 20px var(--display);letter-spacing:0;padding:6px 0}
.hero .hd{font:13px var(--mono);padding-bottom:4px;white-space:nowrap}
.hero .hs{flex:1;min-width:60px}.hero .hs .spark{height:40px}.hero .hs .seedcap{display:none}
.pmeta{display:flex;gap:16px;color:var(--mute);font:12px var(--mono);margin:8px 0 14px;flex-wrap:wrap}
.pmeta span{display:inline-flex;gap:5px;align-items:center}
.ptabs{display:flex;gap:2px;padding:0 22px;border-bottom:1px solid var(--line);margin-top:16px}
.ptabs a{padding:9px 11px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs a.on{color:var(--ink);border-color:var(--accent)}
.ptabs a i{font:normal 11px var(--mono);color:var(--mute);margin-left:4px}
.pbody{padding:14px 22px 22px;overflow:auto;flex:1}
.pbody>div[data-p]{display:none}.pbody>div[data-p].on{display:block}
.psub{font-size:12.5px;color:var(--mute);margin:0 0 8px}
ul.rows.one li{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:14px;padding:8px}
ul.rows.one li.new{border-radius:6px}
ul.rows.one .r{font:12px var(--mono);color:var(--mute);white-space:nowrap}
.chg{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.chg .w{font-size:12px;color:var(--mute);margin-top:2px}
.fold{margin-top:10px;font-size:13px;color:var(--mute)}.fold summary{cursor:pointer}.fold .chg{font-size:13px;color:var(--body,#475467)}
.steps{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:8px;align-items:stretch;margin:2px 0 14px}
.steps .st{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;font-size:13px}
.steps .st span{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);display:block;margin-bottom:3px}
.steps .ar{align-self:center;color:var(--mute)}
dl.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 12px;margin:0;font-size:13px}dl.kv dt{color:var(--mute)}dl.kv dd{margin:0}
.bigspark{margin:0 0 12px}.bigspark .spark{width:100%;height:110px;display:block}
.fold pre{white-space:pre-wrap;font:12px/1.5 var(--mono);background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0 0;color:var(--ink)}
#panel .tstat{grid-template-columns:repeat(4,1fr);margin:0 0 12px}
table.calls{width:100%;border-collapse:collapse;font:12px var(--mono)}table.calls td{padding:6px 4px;border-bottom:1px solid var(--line)}table.calls td:last-child{text-align:right;color:var(--mute);white-space:nowrap}
.pfoot{border-top:1px solid var(--line);padding:10px 22px;display:flex;gap:8px;flex-wrap:wrap}
.pfoot button{padding:5px 10px;font-size:13px}
#panel.open{transform:none;pointer-events:auto}
.tile{user-select:none;-webkit-user-select:none}
#panel h2,#modal h2{font:700 20px/1.25 var(--display);margin:0 30px 4px 0}
.x{position:absolute;top:14px;right:14px;padding:2px 9px}
#panel h4{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 6px;border-bottom:1px solid var(--line);padding-bottom:4px}
#panel q{display:block;font:italic 14px var(--display);border-left:3px solid var(--accent);padding-left:10px;margin:8px 0;quotes:none}
a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:2px;word-break:break-word}
ul.rows{list-style:none;margin:0;padding:0}
ul.rows li{padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}
ul.rows li.new{background:var(--new)}
.tag{font:10px var(--mono);border-radius:3px;padding:1px 5px;margin-left:6px;white-space:nowrap}
.tag.new{background:var(--accent);color:#fff}.tag.seeded{border:1px dashed var(--seed);color:var(--seed)}
.tag.recipe{background:#0a8f5b;color:#fff}.tag.monitor{background:#2f5bff;color:#fff}.tag.run_now{background:var(--ink);color:var(--paper)}.tag.feedback{border:1px solid var(--line);color:var(--mute)}
.when{font:11px var(--mono);color:var(--mute)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
td .followbtn{padding:4px 9px;font-size:12px}
td,th{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:11px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.cathead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
#trace{background:var(--ink);color:var(--paper);padding:16px 22px;display:flex;gap:34px;align-items:center;font-size:12px;border-radius:10px;flex-wrap:wrap;margin-bottom:14px}
.tstat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0}
.tstat div{background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 11px}
.tstat b{display:block;font:600 17px var(--mono)}
.tstat span{font:9px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#98a2b3}
#trace .k{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:#98a2b3;display:block}
#trace .v{font:600 18px var(--mono)}
#trace .v small{font:11px var(--mono);font-weight:400;color:#c3cad6;margin-left:6px}
#trace .t{font:700 15px var(--display);color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:80vw}
#toast.on{opacity:1}
#veil{position:fixed;inset:0;background:#0e132099;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px}
#modal{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(14,19,32,.12);padding:26px 28px;width:min(860px,100%);position:relative;max-height:92vh;overflow:auto}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:8px}
.pcard.hot{border:2px solid var(--accent)}
.pcard b{font:700 20px var(--display)}
.pcard .price{font:600 28px var(--mono)}
.pcard .price small{font:12px var(--mono);color:var(--mute)}
.pcard ul{margin:4px 0 10px;padding-left:18px;color:#475467;font-size:13px;flex:1}
.pcard li{margin:3px 0}
#gbtn{min-height:40px}

button,.sbtn,.btn{border-radius:8px}
.tile{border-radius:12px;box-shadow:0 1px 2px rgba(14,19,32,.04)}
.tile:hover{border-color:var(--accent)}
nav a.on{background:var(--ink);color:#fff}
#q:focus{outline:2px solid var(--accent);outline-offset:1px}
/* ---- look: cool paper, cobalt accent, one sans family; numbers in the display face ---- */
h1,h2,h3{letter-spacing:-.02em}
h1 em,h2 em{font-style:normal}
.val,.num,.hero .val,.price,.hub b,.stat b,.tstat b{font-family:var(--display);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.val small,.num small{font-family:var(--mono);font-weight:400;letter-spacing:0}
.val.none,.hero .val.none{font:500 17px var(--display);font-style:normal;letter-spacing:0}
.brand span{font-style:normal}
</style>
</head>

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={me:{user:null},tiles:[],tab:"board",pending:null,flash:null,open:null,featured:true};

async function api(path,body){
  const r=await fetch(path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);
  const j=await r.json().catch(()=>({}));
  if(r.status==401){signInModal(j.detail); throw new Error(j.detail||"Sign in to do that")}
  if(r.status==402){plansModal(j.detail); throw new Error(j.detail)}
  if(!r.ok) throw new Error(j.detail||r.statusText);
  return j;
}
function toast(t,ms=3500){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),ms)}
function ago(iso){ if(!iso) return "never"; const s=(Date.now()-new Date(iso))/1e3;
  return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"}
function until(iso){const s=(new Date(iso)-Date.now())/1e3; return s<=60?"check due":s<3600?"in "+Math.ceil(s/60)+"m":"in "+Math.round(s/3600)+"h"}
function num(v){const a=Math.abs(v); const t=x=>String(+x.toFixed(2));
  return a>=1e12?t(v/1e12)+"T":a>=1e9?t(v/1e9)+"B":a>=1e6?t(v/1e6)+"M":v.toLocaleString("en-US",{maximumFractionDigits:2})}
const CUR={usd:"$",eur:"€",gbp:"£"};
function val(v,unit){ if(v==null) return null; const m=/^(usd|eur|gbp)\b\s*/i.exec(unit||"");
  return {text:(m?CUR[m[1].toLowerCase()]:"")+num(v), unit:m?unit.slice(m[0].length):(unit||"")}}

/* ---------- account ---------- */
async function loadMe(){

// First run is one decision: pick one name. The board is built from what the catalog already has; more names are added one at a time afterwards.
async function buildStarter(es,view,replace){
  S.busy=true; setTab("board"); let got=0, missed=[]; const pro=S.me.user&&S.me.user.plan=="pro";
  for(const [i,e] of es.entries()){ S.pending=`Building your ${e.name} board…`; renderBoard();
    try{const r=await api("/api/packs",{company:e.name,pack:e.type||"company",phrase:e.adj||null,view:pro&&(e.type||"company")=="company"?"investor":null,replace_board:!!replace&&got==0,hide_empty:true});
      got+=r.tiles.length; if(!r.tiles.length) missed.push(e.name); await loadBoard()}catch(err){missed.push(e.name)} }
  S.pending=null; S.busy=false; await loadMe(); await refresh();
  if(got){ S.addMore={left:3,done:es.map(e=>e.name)}; renderAddMore(); toast(`Your board is ready: ${got} numbers.`,5000) }
  else toast(`Nothing in the catalog yet for ${missed.join(", ")}. New names are built with Pro; here is the example board.`,8000)}

async function renderAddMore(){
  const box=$("#addmore"); if(!S.addMore||S.addMore.left<=0){ box.hidden=true; return }
  const have=new Set(S.tiles.map(t=>t.title.split(" · ")[0].toLowerCase())), opts=(await loadStarters()).filter(e=>!S.addMore.done.includes(e.name)&&!have.has(e.name.toLowerCase())&&!(e.type=="accelerator"&&have.has("yc"))).slice(0,3);
  if(!opts.length){ box.hidden=true; return }
  box.hidden=false; box.innerHTML=`<span><b>Your board is ready.</b> Add another?</span>${opts.map(e=>`<a href="#" class="chip" data-e="${esc(JSON.stringify({name:e.name,type:e.type}))}">+ ${esc(e.name)}</a>`).join("")}<a href="#" class="when" id="amx" style="margin-left:auto">Not now</a>`;
  box.onclick=async ev=>{ ev.preventDefault(); if(ev.target.closest("#amx")){ S.addMore=null; return renderAddMore() }
    const c=ev.target.closest(".chip"); if(!c) return; const e=JSON.parse(c.dataset.e); S.addMore.left--; S.addMore.done.push(e.name); box.hidden=true;
    await doPack(JSON.stringify({company:e.name,pack:e.type,hide_empty:true})); renderAddMore() } }

/* ---------- board ---------- */
function spark(pts){
  if(pts.length<2) return '<svg class="spark"></svg><div class="seedcap"></div>';
  const W=240,H=46,P=4,vs=pts.map(p=>p.value),mn=Math.min(...vs),mx=Math.max(...vs),r=mx-mn;
  const xy=pts.map((p,i)=>[P+i*(W-2*P)/(pts.length-1), r?H-P-(p.value-mn)/r*(H-2*P):H/2]);
  const firstReal=pts.findIndex(p=>!p.seeded), cut=firstReal<0?pts.length:firstReal;
  const path=a=>a.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const seeded=xy.slice(0,Math.min(cut+1,xy.length)), real=xy.slice(Math.max(cut,0)), last=xy[xy.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${seeded.length>1?`<path d="${path(seeded)}" fill="none" stroke="var(--seed)" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke"/>`:""}
    ${real.length>1?`<path d="${path(real)}" fill="none" stroke="var(--ink)" stroke-width="1.8" vector-effect="non-scaling-stroke"/>`:""}
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="var(--accent)"/></svg>
    <div class="seedcap">${cut>0?"┄ seeded history · ━ observed":""}</div>`;
}
const ico=(n,cls="")=>`<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const short=s=>String(s||"").replace(/ ago$/,"").replace(/^in /,"");
function moveChip(t){ // the last time the value moved: which way, by how much, and when
  const p=(t.spark||[]).filter(o=>o.value!=null&&!o.seeded);
  for(let i=p.length-1;i>0;i--){const x=p[i].value-p[i-1].value; if(!x) continue;
    if(p[i-1].origin=="source_history"&&p[i].origin!="source_history"&&!(new Date(p[i].as_of)-new Date(p[i-1].as_of)<=8*864e5)) return null; // the source's past meeting Tally's first reading is not a move
    const pct=p[i-1].value?Math.abs(x)/Math.abs(p[i-1].value)*100:0, at=new Date(p[i].as_of), now=new Date();
    const size=pct<1?num(Math.abs(x)):pct<10?pct.toFixed(1)+"%":Math.round(pct).toLocaleString("en-US")+"%";
    const days=Math.floor((Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate())-Date.UTC(at.getUTCFullYear(),at.getUTCMonth(),at.getUTCDate()))/864e5);
    const on=isNaN(at)?"":days<=0?"today":days==1?"yesterday":at.toLocaleDateString("en-US",at.getUTCFullYear()==now.getUTCFullYear()?{month:"short",day:"numeric",timeZone:"UTC"}:{month:"short",year:"numeric",timeZone:"UTC"});
    return [`<span class="mv ${x>0?"up":"down"}">${x>0?"▲":"▼"} ${size}${on?" · "+on:""}</span>`,p[i-1].value]}
  return null}
function freshDot(t){ // green: read on schedule; amber: a read is overdue; grey: the source could not be read
  if((t.read_failures||0)>=2) return `<span class="chip-i" title="The source could not be read for ${t.read_failures} days"><span class="fd off"></span>not readable</span>`;
  if(!t.last_checked) return "";
  const h=(Date.now()-new Date(t.last_checked))/36e5, due=({week:7,month:30}[t.every]||1)*24;
  return `<span class="chip-i" title="Read ${ago(t.last_checked)}"><span class="fd ${h<=due*2+12?"ok":"late"}"></span>${short(ago(t.last_checked))}</span>`}
function tileHTML(t){
  const v=val(t.value,t.unit); let d='<span class="flat">&nbsp;</span>';
  const mv=t.live&&t.value!=null?moveChip(t):null;
  if(mv) d=`<span class="flat">from ${num(mv[1])}</span>`;
  if(!t.live) d=`<span class="flat">delayed · as of ${ago(t.as_of)}</span>`;
  return `<div class="tile${t.muted?" muted":""}${t.live?"":" delayed"}${S.flash==t.id?" flash":""}" data-id="${t.id}">
    ${t.new_entries?`<span class="badge">${t.new_entries} NEW</span>`:""}
    <h3><span>${esc(t.title)}</span>${t.live?"":'<span class="kind late">delayed</span>'}</h3>
    ${v?`<div class="val">${v.text}<small>${esc(v.unit)}</small>${mv?mv[0]:""}</div>`:`<div class="val none">no value yet</div>`}
    <div class="delta">${d}</div>${spark(t.spark)}
    <div class="foot"><span class="chips">${t.live?freshDot(t):""}${
      t.live&&t.next_check?`<span class="chip-i" title="Next automatic check ${until(t.next_check)}">${ico("radar")}${short(until(t.next_check))}</span>`:t.monitor?`<span class="chip-i" title="Checked automatically">${ico("radar")}</span>`:""}<span class="chip-i" title="Tracked by ${t.followers}">${ico("people")}${t.followers}</span>${
      t.curated?`<span class="chip-i acc" title="Verified method">${ico("seal")}</span>`:""}</span>
    ${t.live?"":`<button class="ghost golive" data-id="${t.id}">Go live</button>`}</div></div>`;
}
function renderBoard(){
  let h=S.tiles.map(tileHTML).join("");
  if(S.pending) h+=`<div class="tile pending">${esc(S.pending)}</div>`;
  $("#board").innerHTML=h||'<div class="empty">Nothing on your board yet. Ask for a number above, or pick some from the shared catalog.</div>';
  S.flash=null;
}
async function loadBoard(){const b=await api("/api/board"); S.tiles=b.tiles; S.featured=b.featured; renderBoard()}
// Numbers keep themselves current: re-read the board every 10 seconds and flash what moved.
let pressing=false;
addEventListener("pointerdown",()=>{pressing=true},true);
["pointerup","pointercancel"].forEach(n=>addEventListener(n,()=>setTimeout(()=>{pressing=false},50),true));
async function pollBoard(){
  if(S.busy||pressing||S.tab!="board"||!$("#veil").hidden) return;
  try{const b=await (await fetch("/api/board")).json(); const old=Object.fromEntries(S.tiles.map(t=>[t.id,t.value]));
    const moved=b.tiles.filter(t=>t.id in old&&old[t.id]!==t.value).map(t=>t.id);
    if(JSON.stringify(b.tiles.map(t=>[t.id,t.value,t.new_entries,t.live]))!=JSON.stringify(S.tiles.map(t=>[t.id,t.value,t.new_entries,t.live]))||moved.length){
      if(pressing) return;  // a click is in progress; the next poll will catch up
      S.tiles=b.tiles; renderBoard(); moved.forEach(id=>{const e=document.querySelector(`.tile[data-id="${id}"]`); if(e) e.classList.add("flash")});
      if(moved.length){toast(moved.length+" number"+(moved.length>1?"s":"")+" just changed"); if(S.tab=="log") loadLog()}}
  }catch(e){}}

const provs=j=>esc(JSON.parse(j||"[]").join(", ")||"—");

    <p class="when" style="margin-top:10px">Open any tile to see the Telem trace for that one number. Search cost is estimated from provider list prices.</p>`;

const pj=x=>{if(x==null) return "(none)"; let o=x; try{if(typeof x=="string"&&/^[\[{]/.test(x.trim())) o=JSON.parse(x)}catch(_){}
  if(o&&typeof o=="object"){const y=o.value??o.new_value??o.number; return y==null?"(none)":String(y)} return String(o)};
const attrOf=c=>{for(const x of [c.before,c.after]){try{const o=JSON.parse(x); if(o&&o.attribute) return o.attribute}catch(_){}} return null};
// A change that moved the number, as opposed to a small edit to one entry. kind = the metric's kind.
const isMajor=(c,kind)=>(c.kind=="entity_added"&&c.before!=null)||c.kind=="source_changed"||(c.kind=="value_changed"&&kind=="direct"&&!attrOf(c));
const smallText=c=>c.kind=="value_changed"?`${esc(c.note||"Entry")} · ${esc(attrOf(c)||"status")}: ${esc(pj(c.before))} → ${esc(pj(c.after))}`:changeText(c);
function changeText(c){
  const link=c.url?` <a href="${esc(c.url)}" target="_blank">↗</a>`:"";
  if(c.kind=="entity_added"&&c.before!=null) return `<b>${esc(c.before)} → ${esc(c.after)}</b> · new entry: ${esc(c.note)}${link}`;
  if(c.kind=="entity_added") return `Now watching: ${esc(c.note||c.after)}${link}`;
  if(c.kind=="value_changed") return `<b>${esc(pj(c.before))} → ${esc(pj(c.after))}</b>${c.note?" · "+esc(c.note):""}${link}`;
  if(c.kind=="source_changed") return `${esc(c.note)}: <a href="${esc(c.after)}" target="_blank">${esc(c.after)}</a>`;
  return esc(c.note||c.after||c.kind)+link;
}

  if(act=="follow"){ if(!S.me.user) return signInModal("Sign in to follow catalog metrics on your own board."); $("#q").value=""; try{await followMetric(arg); S.flash=+arg; setTab("board")}catch(e){} return }
  if(act=="followall"){ if(!S.me.user) return signInModal("Sign in to follow catalog metrics on your own board."); $("#q").value="";
    try{for(const id of arg.split(",")) await api(`/api/metrics/${id}/follow`,{}); toast("Added to your board with their history. Nothing had to be looked up again."); setTab("board"); await loadMe(); refresh()}catch(e){} return }
  if(act=="pack") return doPack(arg);
  if(act=="create") return doCreate(arg);
}
$("#q").oninput=()=>showResults().catch(()=>{});
$("#q").onfocus=()=>showResults().catch(()=>{});
$("#q").onkeydown=ev=>{
  const g=$("#ghost").value, q=$("#q");
  if((ev.key=="Tab"||(ev.key=="ArrowRight"&&q.selectionStart==q.value.length))&&g&&g!=q.value){ev.preventDefault(); q.value=g; return showResults()}
  if(ev.key=="ArrowDown"){ev.preventDefault(); if($("#sugg").hidden) return showResults(); return setSel(sel+1)}
  if(ev.key=="ArrowUp"){ev.preventDefault(); return setSel(sel-1)}
  if(ev.key=="Enter"){ev.preventDefault(); return submitSearch()}  // a form with two text fields does not submit on Enter by itself
  if(ev.key=="Escape"){hideSugg(); $("#ghost").value=""}};
async function submitSearch(){ if(!$("#q").value.trim()) return; if($("#sugg").hidden) await showResults();
  const rows=document.querySelectorAll("#sugg .srow"); if(rows.length) pick(rows[sel]||rows[0])}
$("#add").onsubmit=ev=>{ev.preventDefault(); submitSearch()};
$("#sugg").onclick=ev=>{const c=ev.target.closest(".chip"); if(c){ev.preventDefault(); $("#q").value=c.dataset.fill; $("#q").focus(); return showResults()} const r=ev.target.closest(".srow"); if(r) pick(r)};
document.addEventListener("click",ev=>{if(!ev.target.closest("#add")) hideSugg()});
$("#board").onclick=async ev=>{
  const b=ev.target.closest(".run"), g=ev.target.closest(".golive"), t=ev.target.closest(".tile[data-id]");
  if(g){ev.stopPropagation(); S.me.user?plansModal("This metric is delayed on your plan."):signInModal()}
  else if(b){ev.stopPropagation(); if(!S.me.user) return signInModal("Sign in to refresh a metric."); S.busy=true; b.disabled=true; b.textContent="Checking…";
    try{const r=await api(`/api/metrics/${b.dataset.id}/run`,{}); S.flash=+b.dataset.id;
      if(r.new_entries&&r.new_entries.length){toast(`+${r.new_entries.length} new ${r.new_entries.length>1?"entries":"entry"} found`); S.open=+b.dataset.id}
      else toast(r.found?(r.changed?"Value changed":"Checked — no change"):"Checked — no value found")}
    catch(e){toast(e.message,6000)} S.busy=false; refresh()}
  else if(t) openPanel(+t.dataset.id)};
$("#panel").onclick=async ev=>{
  if(ev.target.closest(".x")) return closePanel();
  const pt=ev.target.closest("[data-pt]"); if(pt){S.ptab=pt.dataset.pt; return showPtab()}
  if(ev.target.closest("#pup")) return plansModal();
  const rp=ev.target.closest(".runp"); if(rp){ if(!S.me.user) return signInModal("Sign in to ask for an early check."); S.busy=true; rp.disabled=true; rp.textContent="Checking…"; S.ptab="ev";
    try{const r=await api(`/api/metrics/${S.open}/run`,{}); S.flash=S.open;
      toast(r.new_entries&&r.new_entries.length?`+${r.new_entries.length} new ${r.new_entries.length>1?"entries":"entry"} found`:r.found?(r.changed?"Value changed":"Checked — no change"):"Checked — no value found")}
    catch(e){toast(e.message,6000)} S.busy=false; return refresh()}
  const na=ev.target.closest(".nac"); if(na){ev.preventDefault(); try{await api(`/api/changes/${na.dataset.c}/reject`,{}); toast("Marked as not a change. Hidden for everyone who tracks this metric.")}catch(e){} return refresh()}
  if(ev.target.closest("#pin2")) return signInModal();
  const fo=ev.target.closest(".fol"); if(fo){ try{await followMetric(fo.dataset.id)}catch(e){} return }
  if(ev.target.closest(".unf")){ try{await api(`/api/metrics/${S.open}/unfollow`,{}); closePanel(); toast("Removed from your board"); await loadMe(); refresh()}catch(e){} return }
  const f=ev.target.closest(".fb"); if(!f) return; f.disabled=true;
  try{const r=await api(`/api/metrics/${S.open}/feedback`,{action:f.dataset.a});
    toast(f.dataset.a=="mute"?(r.muted?"Muted on your board":"Unmuted"):(r.resolved?"Source re-resolved":"No better source found"))}
  catch(e){toast(e.message,6000)} refresh()};
function setTab(tab){S.tab=tab; document.querySelectorAll("nav a").forEach(x=>x.classList.toggle("on",x.dataset.tab==tab));
  $("#board").hidden=tab!="board"; $("#log").hidden=tab!="log"; $("#catalog").hidden=tab!="catalog"; $("#tracetab").hidden=tab!="trace"; if(tab!="board") $("#addmore").hidden=true; else renderAddMore(); $("#f24").style.display=tab=="log"?"flex":"none"; refresh()}
document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>setTab(a.dataset.tab));
$("#last24").onchange=loadLog; $("#smalled").onchange=loadLog;
let cqT; $("#cq").oninput=()=>{clearTimeout(cqT); cqT=setTimeout(loadCatalog,180)};
$("#ctable").onclick=async ev=>{const b=ev.target.closest(".followbtn"), row=ev.target.closest("tr[data-id]");
  if(b){ if(!S.me.user) return signInModal("Sign in to add catalog metrics to your own board."); b.disabled=true; try{await followMetric(b.dataset.id)}catch(e){} }
  else if(row) openPanel(+row.dataset.id)};
document.onkeydown=ev=>{if(ev.key=="Escape"){closeModal();closePanel()}};

(async()=>{
  await loadMe();
  const p=new URLSearchParams(location.search);
  if(p.get("tab")) setTab(p.get("tab")); else refresh();
  if(p.get("q")){ setTab("catalog"); $("#cq").value=p.get("q"); loadCatalog() }
  if(p.get("open")){ openPanel(+p.get("open")); history.replaceState({},"","/app") }
  if(p.get("copy")){ const tok=p.get("copy"); history.replaceState({},"","/app"); if(S.me.user) copyShared(tok); else {S.wantCopy=tok; signInModal("Sign in to copy this board to your own.")} }
  if(p.get("start")){ const e={name:p.get("start").slice(0,60),type:p.get("pack")||"company"}; history.replaceState({},"","/app"); startWith(e) }  // picked on the landing page
  else if(p.get("setup")){ history.replaceState({},"","/app"); starterModal() }
  if(p.get("checkout")=="success"&&p.get("session_id")){
    try{const r=await api("/api/billing/confirm?session_id="+encodeURIComponent(p.get("session_id"))); toast(r.pro?"Welcome to Pro. New numbers and Check now are unlimited.":"Payment not confirmed yet.",6000)}catch(e){toast(e.message,6000)}
    history.replaceState({},"","/app"); await loadMe(); refresh()}
  if(p.get("checkout")=="cancel"){toast("Checkout cancelled"); history.replaceState({},"","/app")}
  if(p.get("plans")) plansModal();
  setInterval(loadTrace,15000); setInterval(pollBoard,10000);
})();
</script>
</body>
